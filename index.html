<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평균 걸음수 계산기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js (OCR 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* 숫자 입력 화살표 숨기기 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 pb-28">

    <div class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- 헤더 영역 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-3 flex items-center justify-center gap-3">
                <i class="fa-solid fa-shoe-prints text-blue-500"></i>
                평균 걸음수 자동 계산기
            </h1>
            <p class="text-gray-600 text-sm md:text-base">
                만보기 앱을 캡처한 사진을 올려주세요. 자동으로 숫자를 읽고 평균을 내드립니다.<br>
                <span class="text-xs text-red-500">(최대 40장까지 업로드 가능)</span>
            </p>
        </header>

        <!-- 업로드 영역 -->
        <div id="drop-zone" class="bg-white border-2 border-dashed border-blue-300 rounded-2xl p-8 text-center cursor-pointer hover:bg-blue-50 transition-colors duration-200 shadow-sm relative group mb-6">
            <input type="file" id="file-input" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
            
            <div class="flex flex-col items-center justify-center space-y-4 pointer-events-none">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div>
                    <p class="text-lg font-semibold text-gray-700">여기를 클릭하거나 사진을 드래그하세요</p>
                    <p class="text-gray-500 text-sm mt-1">지원 형식: JPG, PNG 등</p>
                </div>
            </div>
        </div>

        <!-- 안내 메시지 -->
        <div class="bg-blue-50 border border-blue-200 text-blue-800 rounded-lg p-4 mb-8 text-sm flex items-start gap-3">
            <i class="fa-solid fa-circle-info mt-0.5"></i>
            <div>
                <p><strong>참고사항:</strong> 사진에서 가장 큰 숫자를 걸음 수로 인식하도록 설정되어 있습니다.</p>
                <p>인식이 잘못된 경우(예: 시간이나 날짜를 읽은 경우), <strong>직접 숫자를 클릭하여 수정</strong>할 수 있습니다.</p>
            </div>
        </div>

        <!-- 액션 버튼 -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">
                업로드된 사진 <span id="image-count" class="text-blue-600">0</span>장
            </h2>
            <button id="btn-clear" class="hidden text-sm text-red-500 hover:text-red-700 font-medium px-3 py-1 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">
                <i class="fa-solid fa-trash-can mr-1"></i> 전체 삭제
            </button>
        </div>

        <!-- 결과 목록 (그리드) -->
        <div id="results-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- 자바스크립트로 카드가 생성되어 추가됩니다 -->
        </div>

        <!-- 결과가 없을 때 보여줄 빈 상태 -->
        <div id="empty-state" class="text-center py-16 text-gray-400">
            <i class="fa-regular fa-images text-6xl mb-4 text-gray-300"></i>
            <p>아직 업로드된 사진이 없습니다.</p>
        </div>

    </div>

    <!-- 하단 고정 결과 바 -->
    <div id="bottom-bar" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transform translate-y-full transition-transform duration-300 z-40">
        <div class="max-w-5xl mx-auto px-4 py-4 md:py-5 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-6 w-full md:w-auto justify-between md:justify-start">
                <div class="text-center md:text-left">
                    <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">총 사진 수</p>
                    <p class="text-xl font-bold text-gray-800"><span id="summary-count">0</span> 장</p>
                </div>
                <div class="h-10 w-px bg-gray-300"></div>
                <div class="text-center md:text-left">
                    <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">총 걸음 수</p>
                    <p class="text-xl font-bold text-gray-800"><span id="summary-total">0</span> 보</p>
                </div>
            </div>
            
            <div class="w-full md:w-auto bg-blue-50 px-6 py-3 rounded-xl border border-blue-100 flex items-center justify-between md:justify-start gap-4">
                <span class="text-blue-800 font-bold">일일 평균</span>
                <span class="text-3xl font-extrabold text-blue-600" id="summary-average">0 <span class="text-lg font-bold text-blue-800">걸음</span></span>
            </div>
        </div>
    </div>

    <!-- 토스트 메시지용 컨테이너 -->
    <div id="toast-container" class="fixed bottom-28 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // 상태 관리
        let imagesData = []; 
        let isProcessing = false;
        const MAX_FILES = 40;

        // DOM 요소
        const fileInput = document.getElementById('file-input');
        const resultsGrid = document.getElementById('results-grid');
        const emptyState = document.getElementById('empty-state');
        const imageCountEl = document.getElementById('image-count');
        const summaryCountEl = document.getElementById('summary-count');
        const summaryTotalEl = document.getElementById('summary-total');
        const summaryAverageEl = document.getElementById('summary-average');
        const bottomBar = document.getElementById('bottom-bar');
        const btnClear = document.getElementById('btn-clear');
        const toastContainer = document.getElementById('toast-container');

        // 파일 업로드 이벤트
        fileInput.addEventListener('change', handleFiles);
        
        // 전체 삭제 이벤트
        btnClear.addEventListener('click', () => {
            if(isProcessing) {
                showToast("현재 분석 중인 사진이 있습니다. 완료 후 시도해주세요.", "error");
                return;
            }
            imagesData = [];
            updateUI();
        });

        // 파일 처리 함수
        function handleFiles(event) {
            const files = Array.from(event.target.files);
            
            // 파일 개수 제한 체크
            if (imagesData.length + files.length > MAX_FILES) {
                showToast(`최대 ${MAX_FILES}장까지만 업로드할 수 있습니다.`, "error");
                event.target.value = ''; // 입력 초기화
                return;
            }

            // 새 파일들을 상태 배열에 추가
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
                    const objectUrl = URL.createObjectURL(file);
                    
                    imagesData.push({
                        id: id,
                        file: file,
                        url: objectUrl,
                        steps: 0,
                        status: 'pending' // pending, processing, done, error
                    });
                }
            });

            event.target.value = ''; // 동일한 파일 재선택을 위해 초기화
            updateUI();
            
            // 분석 큐 시작
            processQueue();
        }

        // Tesseract.js를 이용한 OCR 처리 큐
        async function processQueue() {
            if (isProcessing) return;
            isProcessing = true;

            for (let i = 0; i < imagesData.length; i++) {
                if (imagesData[i].status === 'pending') {
                    imagesData[i].status = 'processing';
                    updateUI(); // UI 업데이트 (로딩 스피너 표시)

                    try {
                        // Tesseract로 이미지 분석 (한국어+영어)
                        const result = await Tesseract.recognize(
                            imagesData[i].url,
                            'kor+eng'
                        );
                        
                        // 텍스트에서 걸음수 추출
                        const extractedSteps = extractStepsFromText(result.data.text);
                        
                        imagesData[i].steps = extractedSteps;
                        imagesData[i].status = 'done';
                    } catch (error) {
                        console.error("OCR 분석 에러:", error);
                        imagesData[i].status = 'error';
                    }
                    
                    updateUI(); // 한 장 완료될 때마다 UI 및 평균 재계산
                }
            }

            isProcessing = false;
        }

        // 텍스트에서 걸음수(숫자)를 추론하는 로직
        function extractStepsFromText(text) {
            // 1. 쉼표(,) 제거 (예: 10,000 -> 10000)
            const cleanText = text.replace(/,/g, '');
            
            // 2. 숫자 덩어리들 모두 찾기
            const numberMatches = cleanText.match(/\d+/g);
            if (!numberMatches) return 0;
            
            // 3. 숫자로 변환
            const numbers = numberMatches.map(Number);
            
            // 4. 유효한 걸음수 범위 필터링 (10보 ~ 15만보 사이)
            // 시간(1230), 배터리(85) 등 작은 숫자와 터무니없는 숫자를 걸러내기 위함
            const validNumbers = numbers.filter(n => n > 10 && n <= 150000);
            
            // 5. 조건에 맞는 숫자가 없으면 필터링 전 숫자 중 가장 큰 것 사용
            if (validNumbers.length === 0) {
                 const allMax = Math.max(...numbers);
                 // 그래도 비정상적으로 크면 0 처리 (날짜 등 20231024)
                 return allMax > 200000 ? 0 : allMax; 
            }
            
            // 보통 만보기 화면에서 가장 크고 눈에 띄는 숫자가 걸음수임
            return Math.max(...validNumbers);
        }

        // 숫자 단위 포맷 (10,000)
        function formatNumber(num) {
            return num.toLocaleString('ko-KR');
        }

        // 항목 삭제
        function deleteItem(id) {
            const index = imagesData.findIndex(item => item.id === id);
            if (index > -1) {
                // 메모리 누수 방지
                URL.revokeObjectURL(imagesData[index].url);
                imagesData.splice(index, 1);
                updateUI();
            }
        }

        // 수동으로 숫자 수정
        function updateSteps(id, newSteps) {
            const index = imagesData.findIndex(item => item.id === id);
            if (index > -1) {
                imagesData[index].steps = parseInt(newSteps) || 0;
                updateStats(); // 통계만 재계산 (전체 리렌더링 방지)
            }
        }

        // 통계 영역 계산 및 업데이트
        function updateStats() {
            const totalImages = imagesData.length;
            let totalSteps = 0;
            
            imagesData.forEach(item => {
                totalSteps += item.steps;
            });

            const averageSteps = totalImages > 0 ? Math.round(totalSteps / totalImages) : 0;

            imageCountEl.innerText = totalImages;
            summaryCountEl.innerText = totalImages;
            summaryTotalEl.innerText = formatNumber(totalSteps);
            summaryAverageEl.innerHTML = `${formatNumber(averageSteps)} <span class="text-lg font-bold text-blue-800">걸음</span>`;

            // 하단 바 표시 여부 처리
            if (totalImages > 0) {
                bottomBar.classList.remove('translate-y-full');
            } else {
                bottomBar.classList.add('translate-y-full');
            }
        }

        // 전체 UI 업데이트
        function updateUI() {
            // 화면 표시 상태
            if (imagesData.length === 0) {
                emptyState.classList.remove('hidden');
                btnClear.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                btnClear.classList.remove('hidden');
            }

            // 그리드 렌더링
            resultsGrid.innerHTML = '';
            
            imagesData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden shadow-sm border border-gray-200 flex flex-col relative group transition-all duration-200 hover:shadow-md';
                
                // 썸네일 영역
                const imgContainer = document.createElement('div');
                imgContainer.className = 'w-full aspect-[3/4] bg-gray-100 relative overflow-hidden';
                
                const img = document.createElement('img');
                img.src = item.url;
                img.className = 'w-full h-full object-cover';
                imgContainer.appendChild(img);

                // 삭제 버튼 (오버레이)
                const delBtn = document.createElement('button');
                delBtn.className = 'absolute top-2 right-2 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-500';
                delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                delBtn.onclick = () => deleteItem(item.id);
                imgContainer.appendChild(delBtn);

                // 상태별 오버레이
                if (item.status === 'pending') {
                    const overlay = document.createElement('div');
                    overlay.className = 'absolute inset-0 bg-black/40 flex items-center justify-center';
                    overlay.innerHTML = '<span class="text-white text-sm font-medium">대기중</span>';
                    imgContainer.appendChild(overlay);
                } else if (item.status === 'processing') {
                    const overlay = document.createElement('div');
                    overlay.className = 'absolute inset-0 bg-black/50 flex flex-col items-center justify-center gap-2';
                    overlay.innerHTML = `
                        <div class="loader w-8 h-8 rounded-full border-4 border-gray-300"></div>
                        <span class="text-white text-xs font-medium">분석중...</span>
                    `;
                    imgContainer.appendChild(overlay);
                } else if (item.status === 'error') {
                    const overlay = document.createElement('div');
                    overlay.className = 'absolute inset-0 bg-red-500/50 flex items-center justify-center';
                    overlay.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-white text-2xl"></i>';
                    imgContainer.appendChild(overlay);
                }

                card.appendChild(imgContainer);

                // 데이터 입력 영역
                const dataContainer = document.createElement('div');
                dataContainer.className = 'p-3 flex flex-col gap-1 bg-white';
                
                const label = document.createElement('label');
                label.className = 'text-xs text-gray-500 font-medium';
                label.innerText = '인식된 걸음수';
                dataContainer.appendChild(label);

                const inputWrapper = document.createElement('div');
                inputWrapper.className = 'relative flex items-center';

                const input = document.createElement('input');
                input.type = 'number';
                input.className = 'w-full bg-gray-50 border border-gray-300 text-gray-900 text-lg font-bold rounded-lg focus:ring-blue-500 focus:border-blue-500 block px-2.5 py-1.5 transition-colors disabled:opacity-50 text-right pr-8';
                input.value = item.steps;
                input.disabled = (item.status !== 'done');
                
                // 입력 값이 바뀔 때마다 통계 재계산
                input.addEventListener('input', (e) => {
                    updateSteps(item.id, e.target.value);
                });
                
                inputWrapper.appendChild(input);

                const stepText = document.createElement('span');
                stepText.className = 'absolute right-3 text-gray-500 text-sm font-medium';
                stepText.innerText = '보';
                inputWrapper.appendChild(stepText);

                dataContainer.appendChild(inputWrapper);
                card.appendChild(dataContainer);

                resultsGrid.appendChild(card);
            });

            // 통계 계산
            updateStats();
        }

        // 커스텀 토스트 메시지 (alert 대체)
        function showToast(message, type = "info") {
            const toast = document.createElement('div');
            
            let bgClass = "bg-gray-800";
            let icon = '<i class="fa-solid fa-circle-info text-blue-400"></i>';
            if (type === "error") {
                bgClass = "bg-red-800";
                icon = '<i class="fa-solid fa-circle-exclamation text-red-400"></i>';
            }

            toast.className = `${bgClass} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-y-4 opacity-0`;
            toast.innerHTML = `${icon} <span class="font-medium">${message}</span>`;
            
            toastContainer.appendChild(toast);
            
            // 애니메이션 실행
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });

            // 3초 후 자동 삭제
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
